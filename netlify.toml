# Netlify build configuration for the JASMARTA web app.
# The React app is a static SPA; the Express API and MongoDB live elsewhere
# (Render/Railway + MongoDB Atlas) — see DEPLOYMENT.md.

[build]
  # Run from the repo ROOT so npm workspaces resolve, then build just the web app.
  command = "npm run build:web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# ── SPA fallback ──────────────────────────────────────────────────────────────
# React Router handles /properties, /dashboard, /admin… on the client. Without
# this rule those URLs return 404 on a hard refresh. Netlify serves real files
# first, so /assets/* and /favicon.svg are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ───────────────────────────────────────────────────────────────────
# Vite fingerprints filenames, so hashed assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
